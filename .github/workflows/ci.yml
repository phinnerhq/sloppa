name: "CI"

on:
  push:
    branches: ["master"]
    paths-ignore: ["**/*.md"]
  pull_request:
    paths-ignore: ["**/*.md"]

concurrency:
  group: "${{ github.workflow }}-${{ github.event.number || github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    name: "Build (${{ matrix.name }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-24.04
          - name: windows
            runner: windows-2025
          - name: macos
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Setup pnpm"
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: "Setup Node.js"
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: ".node-version"
          cache: "pnpm"

      - name: "Setup Go"
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: "go.mod"

      - name: "Install Dependencies"
        run: pnpm install --frozen-lockfile

      - name: "Typecheck, Lint and Format"
        run: pnpm run check

      - name: "Build"
        run: pnpm run build

      - name: "Run CLI"
        run: ./dist/sloppa$(go env GOEXE) --version
        shell: bash

      - name: "Test Web"
        run: pnpm exec vitest run
        env:
          # Absolute, since each process resolves it against its own working directory. Empty is off
          NODE_V8_COVERAGE: "${{ runner.os == 'Linux' && format('{0}/coverage/v8', github.workspace) || '' }}"

      # The race detector needs cgo, which only the Linux runner is set up for
      - name: "Test Go"
        run: go test ${{ runner.os == 'Linux' && '-race' || '' }} ./...

      - name: "Check Code Health"
        if: ${{ runner.os == 'Linux' }}
        run: pnpm exec fallow health -c .fallowrc.ci.json

      - name: "Upload Test Results"
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results-${{ matrix.name }}
          path: "test-results/junit.xml"

  docker:
    name: "Docker"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: "Setup Docker Builder"
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: "Login to GitHub Container Registry"
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: "ghcr.io"
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: "Extract Docker Metadata"
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: "ghcr.io/${{ github.repository }}"
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha

      - name: "Build and Publish Docker Image"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: "."
          push: ${{ github.event_name == 'push' }}
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          cache-from: "type=gha"
          cache-to: "type=gha,mode=max"

  # The test results workflow runs outside of this pull request, and reads it from this file
  event-file:
    name: "Event File"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: "Upload Event File"
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: event-file
          path: "${{ github.event_path }}"
