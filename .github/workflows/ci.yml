name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # Also runs `prepare`, which patches tsc and oxlint with the Effect plugin.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # The CLI end to end, against the real server and its previews. Coverage from every
      # process, test workers and spawned servers alike, for fallow's CRAP scores.
      - run: pnpm run test
        env:
          # Absolute: each process resolves it against its own working directory.
          NODE_V8_COVERAGE: ${{ github.workspace }}/coverage/v8
      - run: pnpm exec fallow health -c .fallowrc.ci.json
      - run: pnpm run build

  # The CLI where agents run it. On Windows that means .cmd shims through cmd.exe, and process
  # trees stopped with taskkill. Suites that need POSIX or /proc skip themselves.
  cli:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @sloppa/cli build
      - if: runner.os == 'Windows'
        run: apps\cli\dist\sloppa.cmd --version
        shell: cmd
      - if: runner.os != 'Windows'
        run: apps/cli/dist/sloppa.mjs --version
      - run: pnpm run test

  image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
      # Pull requests only check that the image builds; main publishes it.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
